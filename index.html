    const ai = new Map(A.map((l, i) => [lid(l, i), i])), bi = new Map(B.map((l, i) => [lid(l, i), i]));
    let added = 0, removed = 0;
    B.forEach((l, i) => { const j = ai.get(lid(l, i)), n = `${i+1}번째 줄`;
      if (j == null){ added++; out.push({t:n + " 추가", b:`${charName(l.sp)}: ${l.text || ""}`}); return; }
      const o = A[j];
      if ((o.sp || "") !== (l.sp || "")) out.push({t:n + " 화자", a:charName(o.sp), b:charName(l.sp)});
      if ((o.text || "") !== (l.text || "")) out.push({t:n + " 대사", a:o.text, b:l.text});
      if ((o.dir || "") !== (l.dir || "")) out.push({t:n + " 연출", a:o.dir, b:l.dir});
      if (choiceStr(o.choices) !== choiceStr(l.choices)) out.push({t:n + " 선택지", a:choiceStr(o.choices), b:choiceStr(l.choices)});
    });
    A.forEach((l, j) => { if (!bi.has(lid(l, j))){ removed++; out.push({t:`${j+1}번째 줄 지움`, a:`${charName(l.sp)}: ${l.text || ""}`}); } });
    const keep = (X, other) => X.map(lid).filter(id => other.has(id)).join(",");
    if (keep(A, bi) !== keep(B, ai)) out.push({t:"줄 순서 바뀜"});
  }
  return out;
}
function labelOf(kind, o){
  o = o || {};
  if (kind === "nodes"){ const sc = S.scenes[o.scene]; return (sc ? sc.title + " › " : "") + (o.title || "제목 없음"); }
  if (kind === "scenes") return "장면 › " + (o.title || "");
  if (kind === "chars") return "인물 › " + (o.name || "");
  return "";
}
function strip(kind, o, other){
  if (!o) return null;
  const c = clean(o); delete c.id; delete c.updatedAt;
  if (kind === "chars" && (o.img || "") === (other?.img || "")){ delete c.img; c._imgKept = true; }
  return c;
}
async function logChange(kind, id, before, after, opt){
  if (!FS) return;
  const key = kind + "/" + id, now = Date.now();
  let rec = lastLog.get(key);
  if (opt.fresh || !rec || rec.session !== SESSION || now - rec.at > 180000) rec = {id:uid("g"), before, start:now, session:SESSION};
  rec.at = now;
  if (opt.fresh) lastLog.delete(key); else lastLog.set(key, rec);
  const entry = clean({at:now, startAt:rec.start, who:whoName(), session:SESSION, kind, docId:id,
    label:labelOf(kind, after || rec.before), summary:diffDoc(kind, strip(kind, rec.before, after), strip(kind, after, rec.before)),
    before:strip(kind, rec.before, after), after:strip(kind, after, rec.before), revertOf:opt.revertOf || ""});
  try { await FS.m.setDoc(FS.m.doc(FS.fs, "log/" + rec.id), entry); } catch(e){ console.warn("기록을 남기지 못했어요", e); }
}
function ensureLog(){ if (FS && !logUnsub) subscribeLog(); }
function subscribeLog(){
  if (!FS) return;
  logUnsub?.();
  const m = FS.m;
  logUnsub = m.onSnapshot(m.query(m.collection(FS.fs, "log"), m.orderBy("at", "desc"), m.limit(S.logLimit)), snap => {
    S.log = snap.docs.map(d => ({...d.data(), id:d.id})); S.logLoaded = true; S.logErr = "";
    if (S.drawer && S.dtab === "log") schedule();
  }, err => { S.logLoaded = true; S.logErr = err?.code || "error"; schedule(); });
}
async function downloadLog(){
  if (!FS) return;
  try {
    const m = FS.m, snap = await m.getDocs(m.query(m.collection(FS.fs, "log"), m.orderBy("at", "desc"), m.limit(5000)));
    const rows = snap.docs.map(d => ({id:d.id, ...d.data(), time:new Date(d.data().at).toLocaleString("ko-KR")}));
    downloadText(`meri-dialogue-log_${stamp()}.json`, JSON.stringify(rows, null, 1), "application/json");
  } catch(e){ showNotice("기록을 내려받지 못했어요. (" + (e.code || e.message) + ")"); }
}
function revertTo(ent){
  const kind = ent.kind, id = ent.docId; if (!S[kind]) return;
  const cur = S[kind][id];
  if (!ent.before){ if (!cur) return; delete S[kind][id]; }
  else {
    const o = clean(ent.before);
    if (o._imgKept){ delete o._imgKept; o.img = cur?.img || ""; if (cur?.imgId) o.imgId = cur.imgId; }
    o.id = id; S[kind][id] = kind === "nodes" ? normalizeNode(o) : o;
  }
  S.revertNext.set(kind + "/" + id, ent.id);
  save(kind, id, true);
}
function fmtTime(t){ const d = new Date(t), p = v => String(v).padStart(2, "0"); return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function renderLogTab(){
  if (!FS) return `<div class="hint">저장소에 연결되면 수정 기록이 보여요.</div>`;
  const n = curNode();
  let list = S.log.filter(e => e.summary?.length);
  if (S.logOnly && n) list = list.filter(e => e.kind === "nodes" && e.docId === n.id);
  const head = `<div class="logbar"><label class="lc-tog"><input type="checkbox" data-act="log-only"${S.logOnly ? " checked" : ""}> 지금 노드만${n ? ` (${esc(n.title || "제목 없음")})` : ""}</label>
    <span style="margin-left:auto"></span><button class="btn sm" data-act="log-dl">기록 전체 내려받기</button></div>
    <div class="hint" style="margin-bottom:10px">같은 사람이 같은 곳을 3분 안에 이어서 고친 내용은 한 기록으로 묶어요.</div>`;
  if (S.logErr) return head + `<div class="issue-mini">기록을 불러오지 못했어요 (${esc(S.logErr)}). Firestore 규칙에 log 항목이 있는지 확인해 주세요.</div>`;
  if (!S.logLoaded) return head + `<div class="hint">기록을 불러오는 중…</div>`;
  if (!list.length) return head + `<div class="hint">아직 남은 기록이 없어요.</div>`;
  const canRv = e => ["nodes","scenes","chars"].includes(e.kind);
  const items = list.map(e => {
    const conf = S.confirm === "rv:" + e.id;
    const go = e.kind === "nodes" && S.nodes[e.docId];
    const sum = e.summary.slice(0, 8).map(s => `<div class="lg-s"><b>${esc(s.t)}</b>${s.a ? `<div class="lg-a">${esc(short(s.a))}</div>` : ""}${s.b ? `<div class="lg-b">${esc(short(s.b))}</div>` : ""}</div>`).join("")
      + (e.summary.length > 8 ? `<div class="hint">그 밖에 ${e.summary.length - 8}곳</div>` : "");
    const rv = !canRv(e) ? "" : conf
      ? `<span class="lc-conf">이 수정 전 상태로 돌려요. 그 뒤에 같은 곳을 고친 내용도 함께 돌아가요. <button class="btn sm danger" data-act="log-revert" data-id="${esc(e.id)}">되돌리기</button><button class="btn sm" data-act="cancel">취소</button></span>`
      : `<button class="btn sm" data-act="log-revert" data-id="${esc(e.id)}"${S.readonly ? " disabled" : ""}>이 수정 전으로 되돌리기</button>`;
    return `<div class="lg"><div class="lg-h"><b>${esc(e.who || "이름 없음")}</b><span class="muted">${esc(fmtTime(e.at))}</span>${e.revertOf ? `<span class="k">되돌리기</span>` : ""}</div>
      <div class="lg-l">${esc(e.label || "")}</div>${sum}
      <div class="lg-t">${go ? `<button class="btn sm" data-act="sel-node" data-id="${esc(e.docId)}">이 노드로 →</button>` : ""}${rv}</div></div>`;
  }).join("");
  return head + items + (S.log.length >= S.logLimit ? `<button class="btn sm" data-act="log-more">이전 기록 더 보기</button>` : "");
}

/* ---------- 처음 설정과 처음 데이터 ---------- */
function renderSetup(){
  return `<div class="panel setup"><h2>공유 저장소 연결</h2>
    <p>이 편집기는 Firebase의 무료 저장소(Firestore)에 대화를 저장해서, 링크를 연 모든 사람에게 바로 반영해요. 처음 한 번만 연결하면 됩니다.</p>
    <ol><li>Firebase 콘솔에서 프로젝트를 만들고, 빌드 → Firestore Database → 데이터베이스 만들기를 누릅니다.</li>
      <li>Firestore의 규칙 탭에 아래 규칙을 붙여 넣고 게시합니다.</li>
      <li>프로젝트 설정 → 내 앱 → 웹(&lt;/&gt;) 앱을 추가하고, 나오는 <code>firebaseConfig</code>를 아래 칸에 붙여 넣습니다.</li></ol>
    <details><summary>Firestore 규칙 보기</summary><pre>${esc(RULES)}</pre></details>
    <textarea data-k="cfg" data-act="cfg-text" rows="9" placeholder="const firebaseConfig = {&#10;  apiKey: &quot;…&quot;,&#10;  projectId: &quot;…&quot;,&#10;  …&#10;};" aria-label="firebaseConfig">${esc(S.cfgDraft)}</textarea>
    <div class="r"><button class="btn primary" data-act="cfg-save">연결하기</button>${S.cfgErr ? `<span class="lc-conf">${esc(S.cfgErr)}</span>` : ""}</div></div>`;
}
function seedCounts(){ return `장면 ${Object.keys(SEED.scenes||{}).length}개, 노드 ${Object.keys(SEED.nodes||{}).length}개, 인물 ${Object.keys(SEED.chars||{}).length}명`; }
function renderSeed(){
  return `<div class="emptystate"><b>저장소가 비어 있어요</b>이 파일에 든 대화(${seedCounts()})로 처음 한 번 채울 수 있어요.
    <div style="margin-top:12px"><button class="btn primary" data-act="seed-upload"${S.seeding ? " disabled" : ""}>${S.seeding ? "올리는 중…" : "파일의 대화로 채우기"}</button></div></div>`;
}
async function seedUpload(){
  if (!FS || S.seeding || Object.keys(S.nodes).length) return;
  S.seeding = true; schedule();
  try {
    const m = FS.m, items = [];
    for (const [k, col] of Object.entries(COLS)) for (const [id, o] of Object.entries(SEED[k] || {})) items.push([col + "/" + id, o]);
    for (let i = 0; i < items.length; i += 300){
      const b = m.writeBatch(FS.fs);
      items.slice(i, i + 300).forEach(([p, o]) => b.set(m.doc(FS.fs, p), clean({...o, updatedAt:Date.now()})));
      await b.commit();
    }
    await m.setDoc(m.doc(FS.fs, "log/" + uid("g")), {at:Date.now(), who:whoName(), session:SESSION, kind:"all", docId:"", label:"처음 데이터 올림", summary:[{t:seedCounts() + "을 파일에서 올렸어요"}]});
  } catch(e){ showNotice("처음 데이터를 올리지 못했어요. Firestore 규칙을 확인해 주세요. (" + (e.code || e.message) + ")"); }
  S.seeding = false; schedule();
}

/* ---------- 시작 ---------- */
(async () => {
  SEED = readJson("seed") || {};
  S.assets = {upload: file => new Promise((res, rej) => {
    if (file.size > 600 * 1024) { rej(new Error("too big")); return; }
    const r = new FileReader(); r.onload = () => res({url:r.result, id:""}); r.onerror = rej; r.readAsDataURL(file); })};
  S.downloads = {save: ({filename, data}) => { downloadText(filename, data, "application/json"); return Promise.resolve(); }};
  try { $("#me-name").value = localStorage.getItem("meri-dlg-who") || ""; } catch(e){}
  const c = getConfig();
  if (!c){ S.needConfig = true; S.loaded = {chars:true, scenes:true, nodes:true}; setSave("needcfg"); schedule(); return; }
  S.cfgSrc = c.src; renderNotice();
  try {
    const [appM, m] = await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-firestore.js`)]);
    const app = appM.initializeApp(c.cfg);
    const fs = m.initializeFirestore(app, {ignoreUndefinedProperties:true});
    FS = {fs, m};
    S.db = {
      doc: p => { const r = m.doc(fs, p); return {set: b => m.setDoc(r, b), delete: () => m.deleteDoc(r)}; },
      collection: col => ({onSnapshot: (cb, err) => m.onSnapshot(m.collection(fs, col), cb, err)})
    };
  } catch(e){ setSave("offline"); showNotice("Firebase에 연결하지 못했어요. 인터넷 연결과 설정값을 확인해 주세요. (" + (e.code || e.message) + ")"); schedule(); return; }
  subscribe("chars"); subscribe("scenes"); subscribe("nodes");
})();
})();
</script>
